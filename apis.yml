name: CockroachDB
description: >-
  CockroachDB is a distributed SQL database with strong consistency, PostgreSQL compatibility, and a managed cloud
  offering. The Cloud API manages cluster lifecycle; the Cluster API exposes per-node operational state for monitoring
  and troubleshooting.
