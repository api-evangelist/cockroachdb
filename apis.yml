x-overview: >-
  CockroachDB is a distributed, PostgreSQL-compatible SQL database built by Cockroach Labs. It scales horizontally,
  survives disk, machine, rack, and data-center failures with localized fallout, and provides ACID transactions across
  geographies. CockroachDB is offered as a fully managed service on cockroachlabs.cloud (Basic, Standard, Advanced
  plans) and as self-hosted software. Two REST APIs are available: the CockroachDB Cloud API for managing the lifecycle
  of cloud-hosted clusters, and the per-node CockroachDB Cluster API for cluster health, monitoring, and operational
  status.
